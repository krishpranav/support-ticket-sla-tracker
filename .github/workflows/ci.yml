name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: support
          POSTGRES_PASSWORD: support
          POSTGRES_DB: support
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U support"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://support:support@localhost:5432/support?schema=public
      TEST_DATABASE_URL: postgresql://support:support@localhost:5432/support?schema=public
      JWT_SECRET: ci-only-secret-that-is-longer-than-thirty-two-characters
      BUSINESS_TIMEZONE: Asia/Kolkata
      AGENT_INVITE_CODE: burdenoff-agent
      API_PORT: 4000
      NEXT_PUBLIC_API_URL: http://localhost:4000/graphql
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun --cwd apps/api prisma generate
      - run: bun --cwd apps/api prisma migrate deploy
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test:unit
      - run: bun run test:integration
      - run: bun --cwd apps/web build
